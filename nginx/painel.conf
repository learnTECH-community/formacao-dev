# T9.7: o Nginx na frente do painel e da API, no docker compose.
#   /        arquivos estáticos do painel (dist/), com as rotas do React (/trilha/T2)
#   /api/    repassa para a API (http://api:4320/), sem o prefixo /api
# A imagem é a nginx-unprivileged: o processo não roda como root e escuta na 8080.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Compressão do que é texto. Imagens já vêm comprimidas.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json text/markdown text/plain image/svg+xml application/problem+json;

    # Cabeçalhos de segurança do painel (a API manda os dela, pelo helmet).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Arquivos com hash no nome: cache de 1 ano.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # O catálogo muda a cada PR: o navegador confere sempre (ETag).
    location = /CATALOGO.md {
        expires -1;
        default_type "text/markdown; charset=utf-8";
    }

    # As métricas (T9.9) são só para o coletor, dentro da rede do compose.
    location = /api/metricas {
        return 404;
    }

    # Avisos em tempo real (T5.8): sem buffer, conexão longa.
    location = /api/v1/eventos {
        proxy_pass http://api:4320/v1/eventos;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://api:4320/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        # O cookie da sessão da API vale em /v1; atrás do Nginx, em /api/v1.
        proxy_cookie_path /v1 /api/v1;
        # A API já manda estes; sem isto, a resposta sairia com o cabeçalho duas vezes.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }

    # Rotas do React: o que não é arquivo vira o index.html. Sem cache, para pegar a versão nova.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
