# T9.10: publica a imagem da API no GitHub Container Registry (ghcr.io) ao publicar
# uma release. Tags: a versão da release (1.2.3 e 1.2) e o commit (sha-abc1234).
# Rótulos OCI de origem, versão e commit vêm do docker/metadata-action.
# Em PR que muda a API, o mesmo build roda sem publicar e confere os rótulos.
# Publicar uma release (e decidir se o pacote fica público) é do responsável.
name: Imagem da API
on:
  release:
    types: [published]
  pull_request:
    branches: [main, "developer/**"]
    paths:
      - "api/**"
      - ".dockerignore"
      - ".github/workflows/imagem.yml"
permissions:
  contents: read
jobs:
  imagem:
    runs-on: ubuntu-latest
    # O token do Actions só lê o código e escreve pacotes; nada mais.
    permissions:
      contents: read
      packages: write
    env:
      IMAGEM: ghcr.io/learntech-community/formacao-dev-api
      PUBLICAR: ${{ github.event_name == 'release' }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEM }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=formacao-dev-api
            org.opencontainers.image.description=API do Painel de Formação da learnTECH Community
            org.opencontainers.image.licenses=MIT
      - uses: docker/setup-buildx-action@v3
      - name: Entrar no ghcr.io (só na release)
        if: env.PUBLICAR == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          target: final
          push: ${{ env.PUBLICAR == 'true' }}
          load: ${{ env.PUBLICAR != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Conferir tags e rótulos OCI
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSAO: ${{ steps.meta.outputs.version }}
        run: |
          echo "Tags:"; echo "$TAGS"
          grep -q ":sha-" <<< "$TAGS"
          if [ "$PUBLICAR" != "true" ]; then
            imagem=$(head -n1 <<< "$TAGS")
            rotulos=$(docker inspect "$imagem" --format '{{json .Config.Labels}}')
            echo "$rotulos"
            grep -q '"org.opencontainers.image.source":"https://github.com/learnTECH-community/formacao-dev"' <<< "$rotulos"
            grep -q '"org.opencontainers.image.revision":"' <<< "$rotulos"
            grep -q '"org.opencontainers.image.version":"' <<< "$rotulos"
          fi
          {
            echo "### Imagem da API"
            echo "- publicar: $PUBLICAR"
            echo "- versão: $VERSAO"
            echo '```'; echo "$TAGS"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
