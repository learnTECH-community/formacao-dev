# T9.1: lint, testes e build em todo PR para a main e para as sprints (jobs no CONTRIBUTING.md).
name: CI
on:
  pull_request:
    branches: [main, "developer/**"]
  push:
    branches: [main, "developer/**"]
permissions:
  contents: read
jobs:
  catalogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/catalogo.mjs
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run orcamento
  cobertura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cobertura
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura
          path: cobertura/
          retention-days: 14
  painel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: painel-test-results
          path: test-results/
          retention-days: 14
  api:
    runs-on: ubuntu-latest
    # T6.12: MongoDB para a mesma bateria de testes do repositório.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      # shell: bash liga o pipefail: se o npm test falhar, o passo falha mesmo com o tee.
      - run: npm test | tee teste.log
        shell: bash
      # Os únicos pulados aceitos no Node 22 são os da trava de acesso (rodam no passo do Node 24).
      - name: Nenhum teste do MongoDB pulado
        run: '! grep -q "sem MONGO_URL" teste.log'
      - run: npm audit --omit=dev --audit-level=high
      # T6.11: o autorizador do node:sqlite chegou no Node 24.10; no 22, esses testes ficam
      # pulados com o motivo. Aqui eles rodam no 24 e não podem ser pulados.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test --test-timeout=60000 --test-reporter=spec test/acesso.test.mjs | tee acesso.log
        shell: bash
      - name: Testes de acesso sem nenhum pulado (Node 24)
        run: grep -qx 'ℹ skipped 0' acesso.log
