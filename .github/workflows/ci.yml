# T9.1: lint, testes e build em todo PR para a main e para as sprints (jobs no CONTRIBUTING.md).
name: CI
on:
  pull_request:
    branches: [main, "developer/**"]
  push:
    branches: [main, "developer/**"]
permissions:
  contents: read
jobs:
  catalogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/catalogo.mjs
      # T10.1: nenhum segredo nos arquivos versionados.
      - run: node scripts/segredos.mjs
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run orcamento
      # T10.2: dependências de produção do painel sem vulnerabilidade alta ou crítica.
      - run: npm audit --omit=dev --audit-level=high
  cobertura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cobertura
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura
          path: cobertura/
          retention-days: 14
  painel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: painel-test-results
          path: test-results/
          retention-days: 14
  api:
    runs-on: ubuntu-latest
    # T6.12: MongoDB para a mesma bateria de testes do repositório.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      # shell: bash liga o pipefail: se o npm test falhar, o passo falha mesmo com o tee.
      - run: npm test | tee teste.log
        shell: bash
      # Os únicos pulados aceitos no Node 22 são os da trava de acesso (rodam no passo do Node 24).
      - name: Nenhum teste do MongoDB pulado
        run: '! grep -q "sem MONGO_URL" teste.log'
      # T10.2: dependências de produção da API sem vulnerabilidade alta ou crítica.
      - run: npm audit --omit=dev --audit-level=high
      # T6.11: o autorizador do node:sqlite chegou no Node 24.10; no 22, esses testes ficam
      # pulados com o motivo. Aqui eles rodam no 24 e não podem ser pulados.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test --test-timeout=60000 --test-reporter=spec test/acesso.test.mjs | tee acesso.log
        shell: bash
      - name: Testes de acesso sem nenhum pulado (Node 24)
        run: grep -qx 'ℹ skipped 0' acesso.log
  # T9.4 e T9.12: a imagem da API em estágios e o compose. O Docker roda nos runners do
  # GitHub; na máquina de quem não tem Docker, este job é a prova.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem em estágios
        run: docker build -f api/Dockerfile --target final -t formacao-dev-api:ci .
      - name: Build de comparação, num estágio só (todas as dependências, imagem cheia)
        run: |
          docker build -t formacao-dev-api:um-estagio -f - . <<'DOCKERFILE'
          FROM node:24
          WORKDIR /app/api
          COPY api/package.json api/package-lock.json ./
          RUN npm ci
          COPY api ./
          COPY CATALOGO.md /app/CATALOGO.md
          COPY scripts/catalogo.mjs /app/scripts/catalogo.mjs
          CMD ["node", "src/servidor.mjs"]
          DOCKERFILE
      - name: Tamanho das imagens (antes e depois)
        run: |
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep formacao-dev-api | tee tamanhos.txt
          echo '### Tamanho da imagem da API' >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/- /' tamanhos.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Usuário sem privilégio, só dependências de produção e nada do .dockerignore
        run: |
          uid=$(docker run --rm formacao-dev-api:ci id -u)
          echo "uid do processo: $uid"; test "$uid" != "0"
          # ajv e autocannon são de desenvolvimento: não podem estar na imagem.
          docker run --rm formacao-dev-api:ci sh -c 'test ! -d node_modules/ajv && test ! -d node_modules/autocannon && test -d node_modules/express'
          docker run --rm formacao-dev-api:ci sh -c 'test ! -e /app/.git && test ! -e /app/api/.env && test ! -d /app/api/test && test -f /app/CATALOGO.md'
          # A imagem sobe sozinha (sem banco, com o repositório em memória) e responde.
          docker run -d --name api-sozinha -e REPOSITORIO=memoria -p 127.0.0.1:4399:4320 formacao-dev-api:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4399/v1/health && break; sleep 1; done
          docker logs api-sozinha
          curl -fsS http://127.0.0.1:4399/v1/health
          docker rm -f api-sozinha
      - name: Subir o compose e esperar a saúde
        run: docker compose up --build --wait --wait-timeout 120
      - name: Fumaça da API no compose
        run: |
          curl -fsS http://127.0.0.1:4320/v1/health | tee health.json
          grep -q '"situacao":"ok"' health.json
          curl -fsS http://127.0.0.1:4320/v1/catalogo | head -c 200; echo
      - name: Logs do compose
        if: always()
        run: docker compose logs --no-color | tail -100
      - name: Descer o compose
        if: always()
        run: docker compose down
