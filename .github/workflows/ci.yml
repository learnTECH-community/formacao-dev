name: CI
on:
  pull_request:
    branches: [main, "developer/**"]
  push:
    branches: [main, "developer/**"]
permissions:
  contents: read
jobs:
  catalogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/catalogo.mjs
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run orcamento
  cobertura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cobertura
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura
          path: cobertura/
          retention-days: 14
  painel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: painel-test-results
          path: test-results/
          retention-days: 14
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      # T6.11: o autorizador do node:sqlite chegou no Node 24.10; no 22, esses testes ficam
      # pulados com o motivo. Aqui eles rodam no 24 e não podem ser pulados.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test --test-timeout=60000 --test-reporter=spec test/acesso.test.mjs | tee acesso.log
        shell: bash
      - name: Testes de acesso sem nenhum pulado (Node 24)
        run: grep -qx 'ℹ skipped 0' acesso.log
