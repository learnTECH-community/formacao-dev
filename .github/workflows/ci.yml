name: CI
on:
  pull_request:
    branches: [main, "developer/**"]
  push:
    branches: [main, "developer/**"]
permissions:
  contents: read
jobs:
  catalogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/catalogo.mjs
