# T9.3: publica o painel no GitHub Pages depois do CI verde na main.
# Ligar o Pages (Settings → Pages → Source: GitHub Actions) e a variável PAGES_ATIVO=sim
# são do responsável. Sem a variável, o job de publicação fica pulado e a main segue verde.
# Em PR, o job "previa" gera o build com a base do Pages e confere os caminhos.
name: Pages
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main, "developer/**"]
    paths:
      - "painel/**"
      - "vite.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
env:
  BASE_DO_PAINEL: /formacao-dev/
jobs:
  previa:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # #343: previa: 9 a 15 s. Um travamento cai aqui, e não nas 6 h padrão.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build com a base do Pages
        run: |
          test -f dist/404.html && test -f dist/CATALOGO.md
          grep -q 'src="/formacao-dev/assets/' dist/index.html
          cmp dist/index.html dist/404.html
          echo "build com a base $BASE_DO_PAINEL: ok" >> "$GITHUB_STEP_SUMMARY"

  build:
    # Só depois do CI verde na main (ou à mão), e só com o Pages ligado pelo responsável.
    if: >-
      vars.PAGES_ATIVO == 'sim' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    # #343: build: ainda não rodou (PAGES_ATIVO desligado, #230); o build do painel no CI leva menos de 1 min. Um travamento cai aqui, e não nas 6 h padrão.
    timeout-minutes: 10
    steps:
      # Sem "ref": o checkout pega a main como ela está agora, nunca o código de um PR.
      # Sem cache do npm: o job que publica não reaproveita nada que um PR possa ter gravado
      # (alertas actions/untrusted-checkout e actions/cache-poisoning do CodeQL).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      # Com a API publicada (#230), o responsável define a variável URL_DA_API.
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.URL_DA_API }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  publicar:
    needs: build
    runs-on: ubuntu-latest
    # #343: publicar: ainda não rodou; o deploy do Pages costuma levar 1 a 2 min. O
    # actions/deploy-pages já corta sozinho em 10 min (entrada timeout), com a mensagem de erro
    # dele; o job fica em 15 para essa mensagem aparecer, e não um corte seco (R19 DevOps do #356).
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
